services:
  - type: web
    name: 67movies-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm --filter @cinemaflow/api prisma:generate && pnpm --filter @cinemaflow/api build
    startCommand: node --max-old-space-size=320 apps/api/dist/apps/api/src/main
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: OMDB_API_KEY
        sync: false
      - key: KINOPOISK_DEV_API_KEY
        sync: false
      - key: KINOPOISK_UNOFFICIAL_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
